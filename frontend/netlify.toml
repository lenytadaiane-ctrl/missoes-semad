[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_API_URL = "https://missoes-semad-production.up.railway.app"

[context.dev]
  command = "echo 'Branch dev: não faz deploy automático'"

# SPA fallback — todas as rotas do React
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
